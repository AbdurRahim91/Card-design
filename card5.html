<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Gradient Border Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0c0f17; min-height: 100vh; display: grid; place-items: center; }
    .outer-wrapper { position: relative; width: 330px; border-radius: 20px; padding: 2px; background: linear-gradient(135deg, #f43f5e, #8b5cf6, #06b6d4); overflow: hidden; }
    .outer-wrapper::before { content: ''; position: absolute; inset: -50%; background: conic-gradient(from 0deg, #f43f5e, #8b5cf6, #06b6d4, #f43f5e); animation: rotate 4s linear infinite; }
    @keyframes rotate { 100% { transform: rotate(360deg); } }
    .inner-card { position: relative; background: #111827; border-radius: 18px; padding: 28px 24px; z-index: 1; }
    .badge { background: rgba(244,63,94,0.15); color: #fb7185; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; display: inline-block; margin-bottom: 14px; }
    h3 { color: #fff; font-size: 1.25rem; font-weight: 800; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.88rem; line-height: 1.5; margin-bottom: 20px; }
    .btn-gradient { width: 100%; padding: 11px; background: linear-gradient(135deg, #f43f5e, #8b5cf6); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="outer-wrapper">
    <div class="inner-card">
      <span class="badge">🔥 Hot Release</span>
      <h3>Reactive Motion</h3>
      <p>Fluid keyframe animations and GPU-accelerated gradients designed for next-gen web apps.</p>
      <button class="btn-gradient">Get Started</button>
    </div>
  </div>
</body>
</html>
