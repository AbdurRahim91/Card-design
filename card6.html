<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sneaker Product Showcase Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; min-height: 100vh; display: grid; place-items: center; }
    .product-card { width: 330px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 22px; position: relative; overflow: hidden; }
    .img-wrap { width: 100%; height: 180px; background: radial-gradient(circle, #334155, #1e293b); border-radius: 14px; display: grid; place-items: center; margin-bottom: 16px; overflow: hidden; }
    .product-img { width: 85%; transform: rotate(-15deg); transition: transform 0.4s ease; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6)); }
    .product-card:hover .product-img { transform: rotate(0deg) scale(1.08); }
    .cat { color: #38bdf8; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    h3 { color: #f8fafc; font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
    .price { color: #fff; font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; }
    .sizes { display: flex; gap: 8px; margin-bottom: 18px; }
    .size-btn { width: 34px; height: 34px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #cbd5e1; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .size-btn.active { background: #38bdf8; color: #000; border-color: #38bdf8; }
    .btn-cart { width: 100%; padding: 12px; background: #38bdf8; color: #000; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="product-card">
    <div class="img-wrap">
      <img class="product-img" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=80" alt="Sneaker">
    </div>
    <div class="cat">Running Footwear</div>
    <h3>Air Sonic React</h3>
    <div class="price">$159.00</div>
    <div class="sizes">
      <button class="size-btn">40</button>
      <button class="size-btn active">41</button>
      <button class="size-btn">42</button>
      <button class="size-btn">43</button>
    </div>
    <button class="btn-cart">Add to Cart</button>
  </div>
</body>
</html>
