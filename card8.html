<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #07090e; min-height: 100vh; display: grid; place-items: center; }
    .player-card { width: 320px; background: #121826; border: 1px solid #222d42; border-radius: 24px; padding: 24px; text-align: center; }
    .cover-art { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; margin: 0 auto 18px; border: 4px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.6); animation: spin 16s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h3 { color: #f8fafc; font-size: 1.15rem; margin-bottom: 4px; }
    .artist { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
    .progress-bar { width: 100%; height: 5px; background: #26334a; border-radius: 10px; margin-bottom: 8px; position: relative; }
    .progress-fill { width: 45%; height: 100%; background: #10b981; border-radius: 10px; }
    .time-row { display: flex; justify-content: space-between; color: #64748b; font-size: 0.75rem; margin-bottom: 18px; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 20px; color: #cbd5e1; }
    .play-btn { width: 46px; height: 46px; border-radius: 50%; background: #10b981; color: white; display: grid; place-items: center; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="player-card">
    <img class="cover-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&auto=format&fit=crop&q=80" alt="Album Cover">
    <h3>Midnight Echoes</h3>
    <div class="artist">Synthwave Collective</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="time-row"><span>1:42</span><span>3:50</span></div>
    <div class="controls">
      <span>⏮</span>
      <div class="play-btn">▶</div>
      <span>⏭</span>
    </div>
  </div>
</body>
</html>
