<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Creator Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0c1017; min-height: 100vh; display: grid; place-items: center; }
    .profile-card { width: 330px; background: #161e2e; border: 1px solid #283750; border-radius: 20px; overflow: hidden; text-align: center; }
    .banner { height: 100px; background: linear-gradient(135deg, #ec4899, #8b5cf6); }
    .avatar-wrap { margin-top: -45px; margin-bottom: 12px; }
    .avatar { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #161e2e; object-fit: cover; }
    h3 { color: #f8fafc; font-size: 1.25rem; font-weight: 800; }
    .handle { color: #94a3b8; font-size: 0.8rem; margin-bottom: 14px; }
    .stats { display: flex; justify-content: space-around; padding: 14px 0; border-top: 1px solid #25334c; border-bottom: 1px solid #25334c; margin-bottom: 18px; }
    .stat-num { color: white; font-weight: 800; font-size: 1rem; }
    .stat-label { color: #64748b; font-size: 0.72rem; text-transform: uppercase; }
    .btn-follow { width: calc(100% - 40px); margin: 0 auto 20px; padding: 11px; background: #8b5cf6; color: white; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="banner"></div>
    <div class="avatar-wrap">
      <img class="avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&auto=format&fit=crop&q=80" alt="Avatar">
    </div>
    <h3>Elena Rostova</h3>
    <div class="handle">@elena_creates</div>
    <div class="stats">
      <div><div class="stat-num">142K</div><div class="stat-label">Followers</div></div>
      <div><div class="stat-num">890</div><div class="stat-label">Following</div></div>
      <div><div class="stat-num">2.4M</div><div class="stat-label">Likes</div></div>
    </div>
    <button class="btn-follow">Follow Creator</button>
  </div>
</body>
</html>
