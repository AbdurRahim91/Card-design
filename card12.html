<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gourmet Food Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0c1017; min-height: 100vh; display: grid; place-items: center; }
    .food-card { width: 330px; background: #161e2e; border: 1px solid #283750; border-radius: 20px; overflow: hidden; position: relative; }
    .food-img { width: 100%; height: 200px; object-fit: cover; }
    .rating-badge { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); color: #fbbf24; font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
    .content { padding: 22px; }
    h3 { color: #f8fafc; font-size: 1.25rem; font-weight: 800; margin-bottom: 8px; }
    .meta { display: flex; gap: 14px; color: #94a3b8; font-size: 0.82rem; margin-bottom: 18px; }
    .footer { display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 1.3rem; font-weight: 800; color: #10b981; }
    .btn-order { padding: 9px 18px; background: #f97316; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="food-card">
    <img class="food-img" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80" alt="Avocado Salad">
    <div class="rating-badge">★ 4.9 (320)</div>
    <div class="content">
      <h3>Mediterranean Bowl</h3>
      <div class="meta">
        <span>⏱ 15 Mins</span>
        <span>🔥 420 kcal</span>
      </div>
      <div class="footer">
        <div class="price">$14.50</div>
        <button class="btn-order">Order Now</button>
      </div>
    </div>
  </div>
</body>
</html>
