<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Holographic Cyberpunk Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #070913; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .card { width: 340px; background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; position: relative; overflow: hidden; backdrop-filter: blur(16px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
    .card::before { content: ''; position: absolute; inset: -2px; border-radius: 22px; background: linear-gradient(45deg, #00f2fe, #4facfe, #000, #ff0844); z-index: -1; opacity: 0; transition: opacity 0.4s ease; }
    .card:hover { transform: translateY(-8px) scale(1.02); }
    .card:hover::before { opacity: 0.7; }
    .card-img { width: 100%; height: 190px; border-radius: 14px; object-fit: cover; margin-bottom: 18px; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #00f2fe; background: rgba(0,242,254,0.1); border: 1px solid rgba(0,242,254,0.25); padding: 4px 10px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
    h3 { color: #fff; font-size: 1.25rem; font-weight: 800; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.85rem; line-height: 1.5; margin-bottom: 20px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
    .author { display: flex; align-items: center; gap: 8px; color: #e2e8f0; font-size: 0.82rem; }
    .author-img { width: 28px; height: 28px; border-radius: 50%; }
    .price { font-family: 'JetBrains Mono', monospace; color: #38bdf8; font-weight: 700; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="card">
    <img class="card-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80" alt="Cyberpunk Abstract">
    <span class="tag">NFT #8820</span>
    <h3>Cybernetic Nexus</h3>
    <p>High-dimensional algorithmic artifact generated in real-time neural clusters.</p>
    <div class="card-footer">
      <div class="author">
        <img class="author-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar">
        <span>Aura.eth</span>
      </div>
      <div class="price">2.45 ETH</div>
    </div>
  </div>
</body>
</html>
