<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosted Glassmorphism Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 10% 20%, #ec4899 0%, #3b82f6 90%); min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .glass-card { width: 340px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 24px; padding: 28px 24px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); color: white; transition: transform 0.3s ease; }
    .glass-card:hover { transform: translateY(-6px); }
    .icon-box { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,0.25); display: grid; place-items: center; font-size: 24px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.4); }
    h3 { font-size: 1.35rem; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 0.9rem; line-height: 1.6; opacity: 0.85; margin-bottom: 24px; }
    .btn-glass { width: 100%; padding: 12px; background: rgba(255,255,255,0.9); color: #0f172a; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
    .btn-glass:hover { background: #ffffff; }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="icon-box">💎</div>
    <h3>Glass Interface</h3>
    <p>Crafted with modern backdrop filters, semi-transparent layers, and polished borders.</p>
    <button class="btn-glass">Explore Concept</button>
  </div>
</body>
</html>
