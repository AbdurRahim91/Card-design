<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monochrome Editorial Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #000; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .editorial-card { width: 340px; background: #0a0a0a; border: 1px solid #222; border-radius: 4px; padding: 24px; color: #fff; transition: border-color 0.3s; }
    .editorial-card:hover { border-color: #fff; }
    .num { font-size: 0.75rem; letter-spacing: 2px; color: #666; margin-bottom: 12px; }
    .photo { width: 100%; height: 210px; object-fit: cover; filter: grayscale(100%); transition: filter 0.4s; margin-bottom: 18px; }
    .editorial-card:hover .photo { filter: grayscale(0%); }
    h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-style: italic; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 0.85rem; color: #888; line-height: 1.6; margin-bottom: 18px; }
    .read-link { font-size: 0.75rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; text-decoration: none; border-bottom: 1px solid #fff; padding-bottom: 2px; }
  </style>
</head>
<body>
  <div class="editorial-card">
    <div class="num">N° 04 / ARCHITECTURE</div>
    <img class="photo" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600&auto=format&fit=crop&q=80" alt="Architecture">
    <h3>The Quiet Geometry</h3>
    <p>Exploring silent brutalism and negative space in contemporary Scandinavian shelters.</p>
    <a href="#" class="read-link">Read Story &rarr;</a>
  </div>
</body>
</html>
