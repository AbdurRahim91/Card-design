<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Grid Feature Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; min-height: 100vh; display: grid; place-items: center; }
    .bento-card { width: 340px; background: #0f0f11; border: 1px solid #222226; border-radius: 22px; padding: 28px; color: white; position: relative; overflow: hidden; }
    .bento-tag { font-size: 0.75rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; font-weight: 700; }
    h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; line-height: 1.3; }
    p { color: #71717a; font-size: 0.88rem; line-height: 1.5; margin-bottom: 24px; }
    .metric-badge { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
    .metric-num { font-size: 1.8rem; font-weight: 800; color: #fff; }
    .metric-sub { color: #10b981; font-size: 0.8rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bento-card">
    <div class="bento-tag">Performance</div>
    <h3>Sub-millisecond Edge Latency</h3>
    <p>Routed automatically through our global mesh of 310+ edge locations.</p>
    <div class="metric-badge">
      <div>
        <div class="metric-num">14ms</div>
        <span style="font-size: 0.72rem; color: #71717a;">Avg Global Ping</span>
      </div>
      <div class="metric-sub">&uarr; 3.2x Faster</div>
    </div>
  </div>
</body>
</html>
