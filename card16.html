<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Ticket Pass Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #07090e; min-height: 100vh; display: grid; place-items: center; }
    .ticket { width: 320px; background: #161e2e; border: 1px solid #283750; border-radius: 20px; overflow: hidden; position: relative; }
    .ticket-head { background: linear-gradient(135deg, #3b82f6, #8b5cf6); padding: 20px; color: white; }
    .event-type { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
    h3 { font-size: 1.3rem; font-weight: 800; margin-top: 4px; }
    .ticket-body { padding: 22px; color: white; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .lbl { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; }
    .val { font-size: 0.95rem; font-weight: 700; }
    .barcode { font-family: 'JetBrains Mono', monospace; letter-spacing: 5px; text-align: center; color: #64748b; font-size: 0.9rem; padding-top: 14px; border-top: 2px dashed #243147; }
  </style>
</head>
<body>
  <div class="ticket">
    <div class="ticket-head">
      <div class="event-type">VIP Access Pass</div>
      <h3>AI SUMMIT 2026</h3>
    </div>
    <div class="ticket-body">
      <div class="grid">
        <div><div class="lbl">Date</div><div class="val">Nov 28, 2026</div></div>
        <div><div class="lbl">Location</div><div class="val">San Francisco</div></div>
        <div><div class="lbl">Attendee</div><div class="val">Alex Morgan</div></div>
        <div><div class="lbl">Seat</div><div class="val">A-14 (Front)</div></div>
      </div>
      <div class="barcode">||| | |||| | ||| |||| |</div>
    </div>
  </div>
</body>
</html>
