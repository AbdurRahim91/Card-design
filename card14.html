<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Property Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0c1017; min-height: 100vh; display: grid; place-items: center; }
    .property-card { width: 340px; background: #161e2e; border: 1px solid #283750; border-radius: 20px; overflow: hidden; }
    .thumb { width: 100%; height: 200px; object-fit: cover; }
    .body { padding: 22px; }
    .price-tag { color: #38bdf8; font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
    h3 { color: #f8fafc; font-size: 1.15rem; margin-bottom: 6px; }
    .loc { color: #94a3b8; font-size: 0.8rem; margin-bottom: 16px; }
    .specs { display: flex; justify-content: space-between; border-top: 1px solid #233148; padding-top: 14px; color: #cbd5e1; font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="property-card">
    <img class="thumb" src="https://images.unsplash.com/photo-1613977257363-707ba9348227?w=600&auto=format&fit=crop&q=80" alt="Villa">
    <div class="body">
      <div class="price-tag">$1,450,000</div>
      <h3>The Glass Pavilion</h3>
      <div class="loc">📍 Beverly Hills, California</div>
      <div class="specs">
        <span>🛏 4 Beds</span>
        <span>🚿 3 Baths</span>
        <span>📐 3,800 sqft</span>
      </div>
    </div>
  </div>
</body>
</html>
